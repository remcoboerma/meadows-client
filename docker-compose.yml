networks:
  meadows:
    driver: bridge
  broker:
    external: true
    name: broker

services:
  meadows-client:
    build: .
    image: meadows-client:latest
    restart: "no"
    environment:
      - MEADOWS_SERVER_URL=${MEADOWS_SERVER_URL:-http://localhost:8080}
      - MEADOWS_JWT_SECRET=${MEADOWS_JWT_SECRET:-/shared_keys/jwt.key}
    volumes:
      - ./shared_keys:/shared_keys:ro
    networks:
      - meadows
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
